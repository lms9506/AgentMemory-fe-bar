bundle:
  name: agent-memory

# Vite output is gitignored; must be built before deploy (see scripts/deploy_bundle.sh).
sync:
  include:
    - src/agent_memory/ui/frontend/dist/**

# ── Inputs ────────────────────────────────────────────────────────────────────
# Almost nothing is workspace-specific. Set your catalog/schema once in .env
# (UC_CATALOG / UC_SCHEMA); scripts/deploy_bundle.sh exports them as BUNDLE_VAR_*
# so they flow into these variables. Authenticate with
# `databricks auth login --profile <p>` — the CLI supplies the host + identity,
# so no workspace URL is pinned here. The Lakebase instance and SQL warehouse are
# PROVISIONED by this bundle (below), so there are no ids/endpoints to copy.
variables:
  catalog:
    description: Unity Catalog for the Delta profile table, the UC Volume, and grants
    default: agent_memory
  schema:
    description: UC schema for the accelerator
    default: wealth_advisor
  volume_name:
    description: UC Volume name for raw artifact storage (dossier model)
    default: dossier_raw
  fm_endpoint:
    description: Foundation Model API chat endpoint
    default: databricks-meta-llama-3-3-70b-instruct
  fm_embedding_endpoint:
    description: Foundation Model API embedding endpoint
    default: databricks-gte-large-en
  lakebase_capacity:
    description: Lakebase instance capacity unit (CU_1 is the smallest)
    default: CU_1
  warehouse_size:
    description: SQL warehouse cluster size
    default: 2X-Small

artifacts:
  agent_memory_wheel:
    type: whl
    build: uv build

targets:
  dev:
    mode: development
    default: true
    # No workspace.host/profile pinned here — the CLI provides them from your auth
    # (`databricks auth login --profile <p>`; deploy_bundle.sh exports
    # DATABRICKS_CONFIG_PROFILE from .env). Keeps the bundle workspace-agnostic.

  prod:
    mode: production
    variables:
      catalog: agent_memory_prod

resources:
  # ── Provisioned data infrastructure ──────────────────────────────────────────
  # Created on `bundle deploy` — no pre-existing instance/warehouse required. Their
  # ids/endpoints are resolved by the bundle and referenced below via ${resources…}
  # (and written to .env post-deploy by deploy_bundle.sh, for the notebooks + local
  # tooling that connect outside the bundle).
  database_instances:
    lakebase:
      name: agent-memory-${bundle.target}
      capacity: ${var.lakebase_capacity}

  sql_warehouses:
    warehouse:
      name: agent-memory-${bundle.target}
      warehouse_type: PRO
      cluster_size: ${var.warehouse_size}
      enable_serverless_compute: true
      auto_stop_mins: 10
      max_num_clusters: 1

  volumes:
    dossier_raw_volume:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: ${var.volume_name}
      volume_type: MANAGED
      # App SP gets READ+WRITE VOLUME in 00_setup.py (looked up from the deployed app).

  # ── Lakeflow batch bulk-onboarding (ADR-0019) ────────────────────────────────
  # Declarative pipeline: UC Volume _landing/ → bronze_raw_artifacts (Auto Loader
  # binaryFile) → silver_parsed_artifacts (ai_parse_document + ai_query summary).
  # Governed under ${catalog}.${schema}; the .py deploys standalone (no wheel).
  pipelines:
    dossier_ingest:
      name: agent-memory-dossier-ingest-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      photon: true
      libraries:
        - file:
            path: databricks/pipelines/dossier_ingest.py
      configuration:
        dossier.landing_path: /Volumes/${var.catalog}/${var.schema}/${var.volume_name}/_landing
        dossier.fm_endpoint: ${var.fm_endpoint}

  jobs:
    # ── The batch journey, one run: pipeline → Lakebase hydrate → distill ────────
    # raw Volume → (pipeline) Delta bronze/silver → (hydrate) Lakebase pgvector →
    # (distill) governed client_profile in Delta. Triggered manually / on-demand.
    dossier_ingest_job:
      name: agent-memory-dossier-ingest-${bundle.target}
      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.dossier_ingest.id}
        - task_key: hydrate_lakebase
          depends_on:
            - task_key: run_pipeline
          environment_key: default
          python_wheel_task:
            package_name: agent_memory
            entry_point: hydrate
            named_parameters:
              databricks-host: ${workspace.host}
              uc-catalog: ${var.catalog}
              uc-schema: ${var.schema}
              warehouse-id: ${resources.sql_warehouses.warehouse.id}
              fm-embedding-endpoint: ${var.fm_embedding_endpoint}
              lakebase-instance-name: ${resources.database_instances.lakebase.name}
              lakebase-url: postgresql://${resources.database_instances.lakebase.read_write_dns}/databricks_postgres?sslmode=require
              lakebase-database: databricks_postgres
        - task_key: distill_profiles
          depends_on:
            - task_key: hydrate_lakebase
          environment_key: default
          python_wheel_task:
            package_name: agent_memory
            entry_point: distill
            named_parameters:
              lookback-days: "3650"
              databricks-host: ${workspace.host}
              uc-catalog: ${var.catalog}
              uc-schema: ${var.schema}
              warehouse-id: ${resources.sql_warehouses.warehouse.id}
              fm-endpoint: ${var.fm_endpoint}
              fm-embedding-endpoint: ${var.fm_embedding_endpoint}
              mlflow-experiment: /Shared/agent-memory/${bundle.target}
              lakebase-instance-name: ${resources.database_instances.lakebase.name}
              lakebase-url: postgresql://${resources.database_instances.lakebase.read_write_dns}/databricks_postgres?sslmode=require
              lakebase-database: databricks_postgres
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              # Pin pgvector explicitly: the serverless base image ships an older
              # pgvector that doesn't expose Vector at pgvector.psycopg, and the
              # wheel's transitive requirement doesn't force an upgrade — an
              # explicit top-level dep does.
              - pgvector==0.4.2
              - dist/agent_memory-0.1.0-py3-none-any.whl

    distillation_nightly:
      name: agent-memory-distillation-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: Europe/Berlin
      tasks:
        - task_key: distill_profiles
          environment_key: default
          python_wheel_task:
            package_name: agent_memory
            entry_point: distill
            named_parameters:
              lookback-days: "7"
              databricks-host: ${workspace.host}
              uc-catalog: ${var.catalog}
              uc-schema: ${var.schema}
              warehouse-id: ${resources.sql_warehouses.warehouse.id}
              fm-endpoint: ${var.fm_endpoint}
              fm-embedding-endpoint: ${var.fm_embedding_endpoint}
              mlflow-experiment: /Shared/agent-memory/${bundle.target}
              lakebase-instance-name: ${resources.database_instances.lakebase.name}
              lakebase-url: postgresql://${resources.database_instances.lakebase.read_write_dns}/databricks_postgres?sslmode=require
              lakebase-database: databricks_postgres
      # Serverless-only workspaces — no job_clusters (see bundle resource examples).
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              # Pin pgvector explicitly: the serverless base image ships an older
              # pgvector that doesn't expose Vector at pgvector.psycopg, and the
              # wheel's transitive requirement doesn't force an upgrade — an
              # explicit top-level dep does.
              - pgvector==0.4.2
              - dist/agent_memory-0.1.0-py3-none-any.whl

    distillation_hitl_nightly:
      name: agent-memory-distillation-hitl-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: Europe/Berlin
      tasks:
        - task_key: distill_hitl_profiles
          environment_key: default
          python_wheel_task:
            package_name: agent_memory
            entry_point: distill
            named_parameters:
              lookback-days: "7"
              hitl: "true"
              databricks-host: ${workspace.host}
              uc-catalog: ${var.catalog}
              uc-schema: ${var.schema}
              warehouse-id: ${resources.sql_warehouses.warehouse.id}
              fm-endpoint: ${var.fm_endpoint}
              fm-embedding-endpoint: ${var.fm_embedding_endpoint}
              mlflow-experiment: /Shared/agent-memory/${bundle.target}
              lakebase-instance-name: ${resources.database_instances.lakebase.name}
              lakebase-url: postgresql://${resources.database_instances.lakebase.read_write_dns}/databricks_postgres?sslmode=require
              lakebase-database: databricks_postgres
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              # Pin pgvector explicitly: the serverless base image ships an older
              # pgvector that doesn't expose Vector at pgvector.psycopg, and the
              # wheel's transitive requirement doesn't force an upgrade — an
              # explicit top-level dep does.
              - pgvector==0.4.2
              - dist/agent_memory-0.1.0-py3-none-any.whl

    eval_nightly:
      name: agent-memory-eval-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: Europe/Berlin
      tasks:
        - task_key: run_eval
          environment_key: default
          python_wheel_task:
            package_name: agent_memory
            entry_point: eval
            named_parameters:
              top-k: "5"
              databricks-host: ${workspace.host}
              uc-catalog: ${var.catalog}
              uc-schema: ${var.schema}
              warehouse-id: ${resources.sql_warehouses.warehouse.id}
              fm-endpoint: ${var.fm_endpoint}
              fm-embedding-endpoint: ${var.fm_embedding_endpoint}
              mlflow-experiment: /Shared/agent-memory/${bundle.target}
              lakebase-instance-name: ${resources.database_instances.lakebase.name}
              lakebase-url: postgresql://${resources.database_instances.lakebase.read_write_dns}/databricks_postgres?sslmode=require
              lakebase-database: databricks_postgres
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              # Pin pgvector explicitly: the serverless base image ships an older
              # pgvector that doesn't expose Vector at pgvector.psycopg, and the
              # wheel's transitive requirement doesn't force an upgrade — an
              # explicit top-level dep does.
              - pgvector==0.4.2
              - dist/agent_memory-0.1.0-py3-none-any.whl

  apps:
    wealth_advisor:
      name: wealth-advisor-${bundle.target}
      source_code_path: .
      # Bind the provisioned Lakebase instance: gives the app SP a Postgres role +
      # CONNECT/CREATE. The app mints a short-lived OAuth token at runtime (no
      # password is injected) via the SDK, keyed on LAKEBASE_INSTANCE_NAME below.
      resources:
        - name: lakebase-db
          database:
            instance_name: ${resources.database_instances.lakebase.name}
            database_name: databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
      # App runtime env, templated from the inputs + the provisioned resources.
      # This replaces the old hand-maintained root app.yaml (deleted) — every value
      # is now derived, nothing workspace-specific is hardcoded.
      config:
        command: ["python", "-m", "agent_memory.ui.server"]
        env:
          - name: DATABRICKS_APP_NAME
            value: wealth-advisor-${bundle.target}
          # server.py names the HITL distillation job as agent-memory-distillation-hitl-<BUNDLE_TARGET>.
          - name: BUNDLE_TARGET
            value: ${bundle.target}
          - name: UC_CATALOG
            value: ${var.catalog}
          - name: UC_SCHEMA
            value: ${var.schema}
          - name: VOLUME_NAME
            value: ${var.volume_name}
          - name: DATABRICKS_SQL_WAREHOUSE_ID
            value: ${resources.sql_warehouses.warehouse.id}
          - name: LAKEBASE_INSTANCE_NAME
            value: ${resources.database_instances.lakebase.name}
          - name: LAKEBASE_URL
            value: postgresql://${resources.database_instances.lakebase.read_write_dns}/databricks_postgres?sslmode=require
          - name: LAKEBASE_DATABASE
            value: databricks_postgres
          - name: FM_API_ENDPOINT
            value: ${var.fm_endpoint}
          - name: FM_API_EMBEDDING_ENDPOINT
            value: ${var.fm_embedding_endpoint}
          - name: MLFLOW_EXPERIMENT_NAME
            value: /Shared/agent-memory/${bundle.target}
          - name: MAX_UPLOAD_BYTES
            value: "26214400"
          # Managed agent-memory lane (complementary to the Lakebase/Delta path — ADR-0018).
          # Store is derived from catalog/schema so it stays workspace-agnostic.
          - name: MANAGED_MEMORY_ENABLED
            value: "true"
          - name: MANAGED_MEMORY_STORE
            value: ${var.catalog}.${var.schema}.client_profiles
