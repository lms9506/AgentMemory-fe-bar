bundle:
  name: agent-memory

# Vite output is gitignored; must be built before deploy (see scripts/deploy_bundle.sh).
sync:
  include:
    - src/agent_memory/ui/frontend/dist/**

variables:
  catalog:
    description: Unity Catalog for Delta tables
    default: michael_egli
  schema:
    description: UC schema for the accelerator
    default: smart_advise
  sql_warehouse_id:
    description: SQL warehouse for Delta profile reads/writes
    default: ""
  lakebase_instance:
    description: Lakebase instance name
    default: smart-advise
  lakebase_project:
    description: Lakebase project path (projects/<name>)
    default: projects/smart-advise
  lakebase_branch:
    description: Lakebase branch path
    default: projects/smart-advise/branches/production
  volume_name:
    description: UC Volume name for raw artifact storage (dossier model)
    default: smart_advise_raw

artifacts:
  agent_memory_wheel:
    type: whl
    build: uv build

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      profile: adb-984752964297111
    variables:
      catalog: michael_egli
      sql_warehouse_id: 148ccb90800933a1
      lakebase_instance: smart-advise
      lakebase_project: projects/smart-advise
      lakebase_branch: projects/smart-advise/branches/production

  prod:
    mode: production
    workspace:
      host: https://fevm-serverless-stable-2eacei.cloud.databricks.com
      profile: fevm-serverless-stable-2eacei
    variables:
      catalog: agent_memory_prod
      lakebase_instance: agent-memory-prod
      lakebase_project: projects/agent-memory-prod
      lakebase_branch: projects/agent-memory-prod/branches/production

resources:
  # Volume `${var.catalog}.${var.schema}.${var.volume_name}` already exists in the
  # target workspace and is owned outside this bundle; do not manage it here.
  jobs:
    distillation_nightly:
      name: agent-memory-distillation-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: Europe/Berlin
      tasks:
        - task_key: distill_profiles
          environment_key: default
          python_wheel_task:
            package_name: agent_memory
            entry_point: distill
            named_parameters:
              lookback-days: "7"
              databricks-host: ${workspace.host}
              uc-catalog: ${var.catalog}
              uc-schema: ${var.schema}
              warehouse-id: ${var.sql_warehouse_id}
              fm-endpoint: databricks-meta-llama-3-3-70b-instruct
              fm-embedding-endpoint: databricks-gte-large-en
              mlflow-experiment: /Shared/agent-memory/${bundle.target}
              lakebase-project: ${var.lakebase_project}
              lakebase-branch: ${var.lakebase_branch}
              lakebase-url: postgresql://ep-green-flower-e15qknd0.database.eastus2.azuredatabricks.net/databricks_postgres?sslmode=require
              lakebase-database: databricks_postgres
      # FEVM serverless-only workspaces — no job_clusters (see bundle resource examples).
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - dist/agent_memory-0.1.0-py3-none-any.whl

    distillation_hitl_nightly:
      name: agent-memory-distillation-hitl-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: Europe/Berlin
      tasks:
        - task_key: distill_hitl_profiles
          environment_key: default
          python_wheel_task:
            package_name: agent_memory
            entry_point: distill
            named_parameters:
              lookback-days: "7"
              hitl: "true"
              databricks-host: ${workspace.host}
              uc-catalog: ${var.catalog}
              uc-schema: ${var.schema}
              warehouse-id: ${var.sql_warehouse_id}
              fm-endpoint: databricks-meta-llama-3-3-70b-instruct
              fm-embedding-endpoint: databricks-gte-large-en
              mlflow-experiment: /Shared/agent-memory/${bundle.target}
              lakebase-project: ${var.lakebase_project}
              lakebase-branch: ${var.lakebase_branch}
              lakebase-url: postgresql://ep-green-flower-e15qknd0.database.eastus2.azuredatabricks.net/databricks_postgres?sslmode=require
              lakebase-database: databricks_postgres
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - dist/agent_memory-0.1.0-py3-none-any.whl

    eval_nightly:
      name: agent-memory-eval-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: Europe/Berlin
      tasks:
        - task_key: run_eval
          environment_key: default
          python_wheel_task:
            package_name: agent_memory
            entry_point: eval
            named_parameters:
              top-k: "5"
              databricks-host: ${workspace.host}
              uc-catalog: ${var.catalog}
              uc-schema: ${var.schema}
              warehouse-id: ${var.sql_warehouse_id}
              fm-endpoint: databricks-meta-llama-3-3-70b-instruct
              fm-embedding-endpoint: databricks-gte-large-en
              mlflow-experiment: /Shared/agent-memory/${bundle.target}
              lakebase-project: ${var.lakebase_project}
              lakebase-branch: ${var.lakebase_branch}
              lakebase-url: postgresql://ep-green-flower-e15qknd0.database.eastus2.azuredatabricks.net/databricks_postgres?sslmode=require
              lakebase-database: databricks_postgres
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - dist/agent_memory-0.1.0-py3-none-any.whl

  apps:
    smart_advise:
      name: smart-advise-${bundle.target}
      source_code_path: .
      resources:
        - name: lakebase-db
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_branch}/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
