[project]
name = "agent-memory"
version = "0.1.0"
description = "Databricks Solution Accelerator — agent memory for the AI Wealth Advisor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Databricks Field Engineering" }]

dependencies = [
    "databricks-sdk>=0.30.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "databricks-langchain>=0.4.0",
    "mlflow>=2.18.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.4.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
agent-memory-synthetic = "agent_memory.synthetic.cli:main"
agent-memory-chat = "agent_memory.agents.run:main"
agent-memory-distill = "agent_memory.jobs.distillation_entry:main"
agent-memory-app = "agent_memory.ui.server:main"
agent-memory-eval = "agent_memory.jobs.eval_entry:main"
agent-memory-hydrate = "agent_memory.jobs.hydrate_entry:main"

[project.entry-points.distillation]
distill = "agent_memory.jobs.distillation_entry:main"

[project.entry-points.eval]
eval = "agent_memory.jobs.eval_entry:main"

[project.entry-points.hydrate]
hydrate = "agent_memory.jobs.hydrate_entry:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "pillow>=10.1.0",
]
app = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
# Demo-fixture rendering only (handwritten/PDF/scan artifacts). Not needed by the
# app or the ingest runtime — used by scripts/render_fixtures.py (ADR-0015).
synthetic = [
    "pillow>=10.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TCH", "RUF"]
ignore = ["E501", "TC001", "TC002", "TC003"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[[tool.pyright.executionEnvironments]]
root = "src"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
