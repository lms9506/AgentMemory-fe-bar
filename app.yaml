# Databricks App entry (bundle deploy uses repo root as source_code_path).
command: ["python", "-m", "agent_memory.ui.server"]

env:
  - name: DATABRICKS_APP_NAME
    value: wealth-advisor
  - name: BUNDLE_TARGET
    value: dev
  - name: LAKEBASE_CREDENTIAL_ENDPOINT
    valueFrom: lakebase-db
  - name: LAKEBASE_URL
    value: postgresql://ep-odd-term-d7j3href.database.eu-central-1.cloud.databricks.com/databricks_postgres?sslmode=require
  - name: LAKEBASE_PROJECT
    value: agent-memory
  - name: LAKEBASE_BRANCH
    value: production
  - name: LAKEBASE_COMPUTE
    value: primary
  - name: UC_CATALOG
    value: serverless_stable_2eacei_catalog
  - name: UC_SCHEMA
    value: wealth_advisor
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    value: f0d67490142c3236
  - name: FM_API_ENDPOINT
    value: databricks-meta-llama-3-3-70b-instruct
  - name: FM_API_EMBEDDING_ENDPOINT
    value: databricks-gte-large-en
  - name: MLFLOW_EXPERIMENT_NAME
    value: /Shared/agent-memory/dev
  - name: LAKEBASE_DATABASE
    value: databricks_postgres
  - name: VOLUME_NAME
    value: dossier_raw
  - name: MAX_UPLOAD_BYTES
    value: "26214400"

resources:
  - name: lakebase-db
    database:
      instance: agent-memory

