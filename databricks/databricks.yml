bundle:
  name: agent-memory

variables:
  catalog:
    description: Unity Catalog for Delta tables
    default: agent_memory_dev
  schema:
    description: UC schema for the accelerator
    default: wealth_advisor
  lakebase_instance:
    description: Lakebase instance name
    default: agent-memory-dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${DATABRICKS_HOST}

  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST}
    variables:
      catalog: agent_memory_prod
      lakebase_instance: agent-memory-prod

resources:
  jobs:
    distillation_nightly:
      name: agent-memory-distillation-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: Europe/Berlin
      tasks:
        - task_key: distill_profiles
          notebook_task:
            notebook_path: ../src/jobs/distillation_job.py
          job_cluster_key: distill_cluster
      job_clusters:
        - job_cluster_key: distill_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 0
            data_security_mode: SINGLE_USER

  apps:
    wealth_advisor:
      name: wealth-advisor-${bundle.target}
      source_code_path: ../src/agent_memory/ui

  # TODO: model_serving_endpoints for the LangGraph agent — wire in once M5 lands
